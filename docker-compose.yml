services:
  postgres:
    image: postgres:18
    container_name: telegram_system_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_system
    ports:
      - "5433:5432"
    volumes:
      - telegram_system_postgres18_data:/var/lib/postgresql

volumes:
  telegram_system_postgres18_data:
