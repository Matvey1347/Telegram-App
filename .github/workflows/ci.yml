name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  architecture-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ARCHITECTURE_STRICT=1 pnpm architecture:check
      - run: pnpm test:tooling

  shared-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @telegram-system/shared lint
      - run: pnpm --filter @telegram-system/shared typecheck
      - run: pnpm --filter @telegram-system/shared build
      - run: node scripts/deployment/check-railway-build.mjs shared

  api-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telegram_system_qa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telegram_system_qa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/telegram_system_qa_ci?schema=public
      PUBLICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/telegram_system_qa_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret
      BOT_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy:safe
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api exec jest --runInBand
        env:
          FINANCE_WEB_PUBLIC_URL: https://finance.example.test
      - name: API lint (legacy debt report)
        continue-on-error: true
        run: pnpm --filter api lint
      - run: pnpm --filter api build
      - run: pnpm test:deployment
      - run: node scripts/deployment/check-railway-build.mjs api

  prisma-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telegram_system_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telegram_system_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/telegram_system_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy:safe
      - run: pnpm --filter api exec prisma migrate status
      - run: pnpm --filter api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Verify unsupported partial index
        run: |
          test "$(psql "${DATABASE_URL%%\?*}" -Atc "
            SELECT count(*)
            FROM pg_index i
            JOIN pg_class t ON t.oid = i.indrelid
            WHERE t.relname = 'TelegramManagedPost'
              AND i.indisunique
              AND pg_get_indexdef(i.indexrelid) LIKE '%(\"workspaceId\", \"telegramChannelId\", \"remoteImportKey\")%'
              AND regexp_replace(pg_get_expr(i.indpred, i.indrelid), '[()[:space:]]', '', 'g') = '\"remoteImportKey\"ISNOTNULL'
          ")" = "1"

  web-checks:
    runs-on: ubuntu-latest
    env:
      # Web type generation loads the API Prisma config without connecting.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/telegram_system_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm i18n:check
      - name: Web lint (legacy debt report)
        continue-on-error: true
        run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web exec vitest run
        env:
          TZ: Europe/Warsaw
      - run: NEXT_PUBLIC_API_URL=/api RAILWAY_API_PROXY=true pnpm --filter web build
      - run: node scripts/deployment/check-railway-build.mjs web

  finance-checks:
    runs-on: ubuntu-latest
    env:
      FINANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/finance_ci?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter finance-api prisma:generate
      - run: pnpm --filter finance-api prisma:validate
      - run: pnpm --filter finance-api prisma:migrate:deploy
      - run: pnpm --filter finance-api typecheck
      - run: pnpm --filter finance-api test
      - run: pnpm --filter finance-api build
      - run: pnpm --filter @telegram-system/finance-web typecheck
      - run: pnpm --filter @telegram-system/finance-web exec vitest run
      - run: NEXT_PUBLIC_FINANCE_API_URL=/api pnpm --filter @telegram-system/finance-web build
      - run: node scripts/deployment/check-railway-build.mjs finance-api finance-web
